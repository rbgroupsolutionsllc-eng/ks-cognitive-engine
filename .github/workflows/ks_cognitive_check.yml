name: KS Cognitive Code Quality Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  ks-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run KS Cognitive Linter (code files)
        run: python3 scripts/lint_cognitive_rules.py .

      - name: Run KS Cognitive Linter (docs, including markdown)
        run: python3 scripts/lint_cognitive_rules.py . --include-markdown

      - name: Run regression test suite
        run: |
          pip install pytest --break-system-packages
          pytest tests/test_linter.py -v
