name: Autonomous Weekly Scout & Self-Evolution

on:
  schedule:
    - cron: '0 0 * * 0' # Cada domingo a medianoche UTC
  workflow_dispatch: # Permite ejecución manual con 1 clic

permissions:
  contents: write
  pull-requests: write

jobs:
  scout-and-evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Ecosystem Scout & Update Evolution Ledger
        run: |
          python3 scripts/auto_scout_ecosystem.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG_EVOLUTION.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(evolution): weekly autonomous scout & ecosystem update"
            git push origin master
          else
            echo "No new updates detected in this cycle."
          fi
